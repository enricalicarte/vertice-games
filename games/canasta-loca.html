<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Canasta Loca — VÉRTICE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2B1A55;--cream:#FFF6E5;--lemon:#FFD53D;--gum:#FF4D9D;--lime:#3DE07A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:linear-gradient(180deg,#8B5CFF 0%,#FF8A3D 62%,#FFD53D 100%);color:var(--ink);
    font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:500;
    -webkit-font-smoothing:antialiased;touch-action:none;user-select:none;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:16px 18px;pointer-events:none;gap:14px}
  .chunk{background:var(--cream);border:5px solid var(--ink);border-radius:999px;
    box-shadow:0 6px 0 var(--ink);padding:9px 20px;font-weight:700;font-size:17px}
  .back{pointer-events:auto;text-decoration:none;color:var(--ink);transition:transform .1s,box-shadow .1s}
  .back:hover{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
  .score{background:var(--lemon);font-size:clamp(1.4rem,5.2vw,2.1rem);padding:6px 24px 8px;
    border-radius:26px;line-height:1.1;text-align:center;min-width:96px}
  .best{display:block;font-size:.7rem;font-weight:600;opacity:.72;margin-top:-2px}

  .panel{position:fixed;inset:0;display:grid;place-items:center;padding:22px;
    background:rgba(43,26,85,.45);backdrop-filter:blur(4px)}
  .panel[hidden]{display:none}
  .card{background:var(--cream);border:7px solid var(--ink);border-radius:34px;
    box-shadow:0 14px 0 var(--ink),0 30px 50px rgba(43,26,85,.45);
    padding:32px 28px 28px;max-width:430px;width:100%;text-align:center;
    animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.75) translateY(24px)}to{opacity:1;transform:none}}
  .card h1{isolation:isolate;margin:0 0 10px;font-size:clamp(1.9rem,7.5vw,2.8rem);
    font-weight:700;line-height:.95;position:relative;color:var(--gum)}
  .card h1::before{content:attr(data-text);position:absolute;inset:0;z-index:-1;
    -webkit-text-stroke:10px var(--ink);color:transparent}
  .result{font-size:1.12rem;font-weight:600;margin:0 0 12px}
  .result b{font-size:1.4rem;color:var(--gum)}
  .card p{margin:0 0 8px;font-size:1rem;font-weight:400;color:#5A4A80;line-height:1.45}
  button{margin-top:18px;width:100%;padding:15px 20px 17px;font:inherit;font-weight:700;
    font-size:1.3rem;color:var(--ink);background:var(--lime);border:6px solid var(--ink);
    border-radius:999px;cursor:pointer;box-shadow:0 9px 0 #1E9E52;
    transition:transform .1s,box-shadow .1s}
  button:hover{transform:translateY(4px);box-shadow:0 5px 0 #1E9E52}
  button:active{transform:translateY(9px);box-shadow:0 0 0 #1E9E52}
  button:focus-visible{outline:5px solid var(--lemon);outline-offset:4px}
  .timechip{position:fixed;top:16px;left:50%;transform:translateX(-50%);
    background:var(--gum);color:var(--cream);border:5px solid var(--ink);border-radius:999px;
    box-shadow:0 6px 0 var(--ink);padding:8px 22px;font-weight:700;font-size:1.3rem;
    pointer-events:none}
  .timechip.low{background:var(--ink);color:var(--lemon)}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <a class="chunk back" href="../index.html">← Volver</a>
  <div class="chunk score"><span id="score">0</span><span class="best" id="best"></span></div>
</div>
<div class="timechip" id="time">60</div>

<div class="panel" id="panel">
  <div class="card">
    <h1 id="ptitle" data-text="Canasta Loca">Canasta Loca</h1>
    <p class="result" id="presult" hidden></p>
    <p>Encesta antes de que se acabe el tiempo. Cada canasta te regala tres segundos, así que la buena racha se paga sola.</p>
    <p>Arrastra hacia atrás y suelta, como un tirachinas. La línea de puntos te enseña por dónde va a ir.</p>
    <button id="play">¡Empezar!</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ══ base común de VÉRTICE ══════════════════════════════════════════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, 1, .1, 400);
scene.add(new THREE.HemisphereLight(0xFFFFFF, 0x7C5BD0, 2.5));
const sun = new THREE.DirectionalLight(0xFFFFFF, 2.0);
sun.position.set(6, 13, 8);
scene.add(sun);

/* rampa de tres escalones: sombreado plano, de dibujo animado */
const steps = new Uint8Array([90, 90, 180, 180, 255, 255, 255, 255]);
const ramp = new THREE.DataTexture(steps, steps.length, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter;
ramp.needsUpdate = true;

const toon = c => new THREE.MeshToonMaterial({ color:c, gradientMap:ramp });
const INK  = new THREE.MeshBasicMaterial({ color:0x2B1A55, side:THREE.BackSide });
const CANDY = [0xFF4D9D, 0xFFD53D, 0x3DE07A, 0xFF8A3D, 0x9B5CFF, 0x3FB8FF];
const rbox = (w,h,d,r=.2) =>
  new RoundedBoxGeometry(w, h, d, 4, Math.max(.02, Math.min(r, w/2.1, h/2.1, d/2.1)));

/* contorno: copia inflada del cuerpo, vista por dentro */
function outlined(geo, color, t = 1.09, parent = scene) {
  const g = new THREE.Group();
  const skin = new THREE.Mesh(geo, toon(color));
  const line = new THREE.Mesh(geo, INK);
  line.scale.setScalar(t);
  g.add(skin, line);
  g.userData.skin = skin;
  g.userData.line = line;
  parent.add(g);
  return g;
}

/* personaje rechoncho con ojos */
const EYE_W = new THREE.MeshBasicMaterial({ color:0xFFFFFF });
const EYE_B = new THREE.MeshBasicMaterial({ color:0x2B1A55 });
function chara(color, r = .5, h = .6) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(r, h, 6, 18), toon(color));
  const line = new THREE.Mesh(body.geometry, INK);
  line.scale.setScalar(1.1);
  g.add(body, line);
  for (const sx of [-r*.42, r*.42]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(r*.34, 14, 14), EYE_W);
    w.position.set(sx, h*.45, r*.86); w.scale.z = .45; g.add(w);
    const b = new THREE.Mesh(new THREE.SphereGeometry(r*.17, 12, 12), EYE_B);
    b.position.set(sx, h*.45, r*1.02); b.scale.z = .45; g.add(b);
  }
  g.userData.body = body;
  scene.add(g);
  return g;
}

/* ── HUD ── */
const panel   = document.getElementById('panel');
const presult = document.getElementById('presult');
const ptitle  = document.getElementById('ptitle');
const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const playBtn = document.getElementById('play');

function setTitle(text, color) {
  ptitle.textContent = text; ptitle.dataset.text = text; ptitle.style.color = color;
}
function showPanel() {
  const card = panel.firstElementChild;
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  panel.hidden = false;
}

const BKEY = 'vertice.canasta-loca';
const loadBest = () => { try { return Number(localStorage.getItem(BKEY)) || 0; } catch { return 0; } };
const saveBest = v => { try { localStorage.setItem(BKEY, String(v)); } catch {} };
let best = loadBest();
const paintBest = () => { bestEl.textContent = best ? `récord ${best}` : ''; };
paintBest();

/* ── confeti ── */
const confetti = [];
const confGeo = new THREE.PlaneGeometry(.26, .36);
function burst(pos, n = 50, spread = 3) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(confGeo, new THREE.MeshBasicMaterial({
      color: CANDY[i % CANDY.length], side: THREE.DoubleSide
    }));
    m.position.copy(pos).add(new THREE.Vector3(
      (Math.random()-.5)*spread, Math.random()*spread, (Math.random()-.5)*spread));
    m.userData = { v:new THREE.Vector3((Math.random()-.5)*.12, .06+Math.random()*.11, (Math.random()-.5)*.12),
                   rx:(Math.random()-.5)*.22, rz:(Math.random()-.5)*.22, life:1 };
    scene.add(m); confetti.push(m);
  }
}
function stepConfetti() {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const m = confetti[i];
    m.userData.v.y -= .006;
    m.position.add(m.userData.v);
    m.rotation.x += m.userData.rx;
    m.rotation.z += m.userData.rz;
    m.userData.life -= .008;
    if (m.userData.life <= 0) { scene.remove(m); m.material.dispose(); confetti.splice(i,1); }
  }
}
function clearConfetti() {
  for (const m of confetti) { scene.remove(m); m.material.dispose(); }
  confetti.length = 0;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ══ Canasta Loca ════════════════════════════════════════════════════════ */

camera.fov = 50;
camera.updateProjectionMatrix();
camera.position.set(0, 3.4, 7.2);
camera.lookAt(0, 2.2, -12);
scene.fog = new THREE.Fog(0xFFC17A, 30, 70);

const HOOP_Z = -13, HOOP_Y = 3.3, HOOP_R = .78;

/* pista */
const floor = outlined(rbox(26, .8, 44, .3), 0xFF8A3D, 1.01);
floor.position.set(0, -.4, -12);
for (let i = 0; i < 5; i++) {
  const line = new THREE.Mesh(rbox(22, .02, .16, .01), toon(0xFFF6E5));
  line.position.set(0, .02, -2 - i * 5);
  scene.add(line);
}

/* canasta */
const board = outlined(rbox(4.4, 3, .35, .2), 0xFFF6E5, 1.03);
board.position.set(0, HOOP_Y + 1.5, HOOP_Z - .9);
const boardBox = outlined(rbox(1.9, 1.4, .1, .06), 0xFF4D9D, 1.06);
boardBox.position.set(0, HOOP_Y + 1.1, HOOP_Z - .7);
const hoop = outlined(new THREE.TorusGeometry(HOOP_R, .1, 8, 26), 0xFF4D9D, 1.12);
hoop.rotation.x = Math.PI / 2;
hoop.position.set(0, HOOP_Y, HOOP_Z);
const post = outlined(rbox(.5, 5.6, .5, .14), 0x9B5CFF, 1.05);
post.position.set(0, HOOP_Y - 1.4, HOOP_Z - 1.6);
const rig = new THREE.Group();      // todo se mueve junto
scene.add(rig);
for (const o of [board, boardBox, hoop, post]) rig.add(o);

/* balón */
const ball = outlined(new THREE.IcosahedronGeometry(.42, 2), 0xFFD53D, 1.07);
const START = new THREE.Vector3(0, 1.15, 3.2);
const vel = new THREE.Vector3();
let flying = false, prevY = 0, scored = false;

/* puntos de la trayectoria prevista */
const dots = [];
const dotGeo = new THREE.SphereGeometry(.09, 8, 8);
const dotMat = new THREE.MeshBasicMaterial({ color:0x2B1A55, transparent:true, opacity:.5 });
for (let i = 0; i < 16; i++) {
  const d = new THREE.Mesh(dotGeo, dotMat);
  d.visible = false;
  scene.add(d);
  dots.push(d);
}

let state = 'ready', score = 0, streak = 0, timeLeft = 60, hoopT = 0, last = 0;
const timeEl = document.getElementById('time');

function resetBall() {
  ball.position.copy(START);
  vel.set(0, 0, 0);
  flying = false; scored = false;
  ball.scale.set(1,1,1);
}

function start() {
  clearConfetti();
  score = 0; streak = 0; timeLeft = 60; hoopT = 0;
  scoreEl.textContent = '0';
  timeEl.textContent = '60';
  timeEl.classList.remove('low');
  resetBall();
  panel.hidden = true;
  last = performance.now();
  state = 'play';
}
playBtn.addEventListener('click', start);

function gameOver() {
  state = 'over';
  const record = score > best;
  if (record) { best = score; saveBest(best); paintBest(); burst(new THREE.Vector3(0,3,-4), 70, 5); }
  setTitle(record ? '¡Récord!' : 'Se acabó', record ? '#3DE07A' : '#FF4D9D');
  presult.hidden = false;
  presult.innerHTML = record
    ? `<b>${score} canastas</b><br>Tu mejor tarde con diferencia.`
    : `<b>${score} canastas</b><br>Tu récord está en ${best}.`;
  playBtn.textContent = '¡Otra vez!';
  showPanel();
}

function basket() {
  score++; streak++;
  timeLeft = Math.min(99, timeLeft + 3);
  scoreEl.textContent = score;
  burst(hoop.getWorldPosition(new THREE.Vector3()), streak > 2 ? 40 : 20, 2.5);
  scored = true;
}

/* ── tirachinas ── */
let drag = null;
function shotFrom(dx, dy) {
  const power = Math.min(Math.hypot(dx, dy), 240) / 240;
  return new THREE.Vector3(
    -dx * .016,
    .17 + power * .30,
    -(.20 + power * .52)
  );
}
function preview(v) {
  const p = ball.position.clone(), w = v.clone();
  for (let i = 0; i < dots.length; i++) {
    for (let k = 0; k < 4; k++) { w.y -= .012; p.add(w); }
    dots[i].position.copy(p);
    dots[i].visible = p.y > -.4;
  }
}
function hideDots() { for (const d of dots) d.visible = false; }

canvas.addEventListener('pointerdown', e => {
  if (state !== 'play' || flying) return;
  drag = { x:e.clientX, y:e.clientY };
});
addEventListener('pointermove', e => {
  if (!drag) return;
  preview(shotFrom(e.clientX - drag.x, e.clientY - drag.y));
});
addEventListener('pointerup', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag = null;
  hideDots();
  if (Math.hypot(dx, dy) < 18) return;      // toque suelto: no dispares sin querer
  vel.copy(shotFrom(dx, dy));
  flying = true;
  prevY = ball.position.y;
  streak = streak;                          // la racha solo se corta al fallar
});
addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') { e.preventDefault(); start(); }
});

/* ── bucle ── */
function frame(now) {
  requestAnimationFrame(frame);

  if (state === 'play') {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    timeLeft -= dt;
    timeEl.textContent = Math.max(0, Math.ceil(timeLeft));
    timeEl.classList.toggle('low', timeLeft < 10);
    if (timeLeft <= 0) { gameOver(); return; }

    // la canasta se mueve, y más rápido cuanto mejor lo estás haciendo
    hoopT += .012 + Math.min(score, 20) * .0009;
    rig.position.x = Math.sin(hoopT) * (1.6 + Math.min(score, 15) * .18);

    if (flying) {
      vel.y -= .012;
      ball.position.add(vel);
      ball.rotation.x += .13; ball.rotation.z += .07;

      const hp = hoop.getWorldPosition(new THREE.Vector3());
      // canasta: cruza el aro de arriba abajo y por dentro
      if (!scored && vel.y < 0 && prevY > hp.y && ball.position.y <= hp.y) {
        const d = Math.hypot(ball.position.x - hp.x, ball.position.z - hp.z);
        if (d < HOOP_R) basket();
      }
      // tablero
      if (ball.position.z < HOOP_Z - .6 && ball.position.z > HOOP_Z - 1.4 &&
          Math.abs(ball.position.x - rig.position.x) < 2.2 &&
          ball.position.y > HOOP_Y - .2 && ball.position.y < HOOP_Y + 3 && vel.z < 0) {
        vel.z *= -.55; vel.x *= .7;
      }
      prevY = ball.position.y;

      if (ball.position.y < .42) {          // bote en el suelo
        ball.position.y = .42;
        vel.y *= -.42; vel.x *= .8; vel.z *= .8;
        if (Math.abs(vel.y) < .05) {
          if (!scored) streak = 0;
          resetBall();
        }
      }
      if (ball.position.z < HOOP_Z - 4 || ball.position.z > 8 || Math.abs(ball.position.x) > 12) {
        if (!scored) streak = 0;
        resetBall();
      }
    } else {
      ball.position.y = START.y + Math.sin(now * .004) * .08;
    }
  }

  stepConfetti();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

</script>
</body>
</html>
